<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Once upon a time: the kingdom, the curse, the quest, happily ever after">
  <rect width="1200" height="300" fill="#ffffff"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="20" y="20" width="270" height="260" rx="24" fill="#f4f6fb" stroke="#10204a" stroke-width="3"/>
      <text x="155" y="105" font-size="64">🏰</text>
      <text x="155" y="165" font-size="26" font-weight="700" fill="#10204a">The kingdom</text>
      <text x="155" y="205" font-size="17" fill="#4a5578">A Java agent dreams of Atlas</text>
    </g>
    <g>
      <rect x="320" y="20" width="270" height="260" rx="24" fill="#f4f6fb" stroke="#10204a" stroke-width="3"/>
      <text x="455" y="105" font-size="64">🐉</text>
      <text x="455" y="165" font-size="26" font-weight="700" fill="#10204a">The curse</text>
      <text x="455" y="205" font-size="17" fill="#4a5578">A dragon named java-none</text>
    </g>
    <g>
      <rect x="610" y="20" width="270" height="260" rx="24" fill="#f4f6fb" stroke="#10204a" stroke-width="3"/>
      <text x="745" y="105" font-size="64">🗺️</text>
      <text x="745" y="165" font-size="26" font-weight="700" fill="#10204a">The quest</text>
      <text x="745" y="205" font-size="17" fill="#4a5578">Smuggle Java past the dragon</text>
    </g>
    <g>
      <rect x="910" y="20" width="270" height="260" rx="24" fill="#f4f6fb" stroke="#10204a" stroke-width="3"/>
      <text x="1045" y="105" font-size="64">✨</text>
      <text x="1045" y="165" font-size="26" font-weight="700" fill="#10204a">Happily ever after</text>
      <text x="1045" y="205" font-size="17" fill="#4a5578">Java answers from Atlas</text>
    </g>
  </g>
</svg>
